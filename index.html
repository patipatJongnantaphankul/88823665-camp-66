<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <style>
            .required-label::after {
                content: "*";
                color: red;
            }
        </style>
    </head>
    <body>
    <div class="container mt-5">
        <form>
            <div class="mb-3 row">
                <label for="fname" class="col-sm-2 col-form-label required-label">ชื่อ</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="fname" name="fname" required>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="lname" class="col-sm-2 col-form-label">นามสกุล</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="lname" name="lname">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="bd" class="col-sm-2 col-form-label">วัน/เดือน/ปีเกิด</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" id="bd" name="bd">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="age" class="col-sm-2 col-form-label">อายุ</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" id="age" name="age" min="0">
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">เพศ</label>
                <div class="col-sm-10">
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="male" name="gender" value="ชาย">
                        <label for="male" class="form-check-label">ชาย</label>
                    </div>
                    <br>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="female" name="gender" value="หญิง">
                        <label for="female" class="form-check-label">หญิง</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="pic" class="col-sm-2 col-form-label">รูป</label>
                <div class="col-sm-10">
                    <input type="file" class="form-control" id="pic" name="pic">
                </div>
            </div>

            <div class="mb-3 row">
                <label for="address" class="col-sm-2 col-form-label">ที่อยู่</label>
                <div class="col-sm-10">
                    <textarea class="form-control" id="address" rows="4"></textarea>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="color" class="col-sm-2 col-form-label">สีที่ชอบ</label>
                <div class="col-sm-10">
                    <select class="form-select" id="color" name="color">
                        <option value="red">แดง</option>
                        <option value="blue">น้ำเงิน</option>
                        <option value="green">เขียว</option>
                        <option value="yellow">เหลือง</option>
                    </select>
                </div>
            </div>

            <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">แนวเพลงที่ชอบ</label>
                <div class="col-sm-10">
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="pop" name="music" value="เพื่อชีวิต">
                        <label for="pop" class="form-check-label">เพื่อชีวิต</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="folk" name="music" value="ลูกทุ่ง">
                        <label for="folk" class="form-check-label">ลูกทุ่ง</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="other" name="music" value="อื่นๆ">
                        <label for="other" class="form-check-label">อื่นๆ</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="consent" name="consent">
                        <label for="consent" class="form-check-label">ยินยอมให้เก็บข้อมูล</label>
                    </div>
                
            </div>

            <div class="mt-3">
                <button type="reset" class="btn btn-secondary" style="float: left;">Reset</button>
                <button type="submit" class="btn btn-success" style="float: right;">Submit</button>
            </div>
                                
        </form>
    </div>

    </body>
</html>
